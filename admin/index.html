<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>부스 주문 관리</title>
  <link rel="stylesheet" href="../assets/styles.css">
</head>
<body class="admin-body">
  <main class="admin-login-wrap" id="admin-login">
    <section class="admin-login-card" aria-labelledby="login-title">
      <p class="eyebrow">부스 관리</p>
      <h1 id="login-title">관리자 로그인</h1>
      <p id="login-status">로그인 상태를 확인하고 있습니다.</p>
      <div class="admin-login-email">k01027895490@gmail.com</div>
      <label class="field-label login-password-label" for="admin-password">비밀번호</label>
      <input class="text-input login-password-input" id="admin-password" type="password" autocomplete="current-password" placeholder="Supabase 관리자 계정 비밀번호">
      <button class="primary-button" id="admin-password-login" type="button">비밀번호로 로그인</button>
      <div class="payment-divider login-divider"><span>또는</span></div>
      <button class="secondary-button" id="send-login-link" type="button" hidden>이메일로 로그인 링크 받기</button>
      <button class="secondary-button" id="login-sign-out" type="button" hidden>다른 계정으로 로그인</button>
      <a class="text-button login-customer-link" href="../index.html">고객 화면으로 돌아가기</a>
    </section>
  </main>

  <div id="admin-app" hidden>
    <header class="admin-header">
      <div><p class="eyebrow">부스 관리</p><h1>주문 관리</h1><p>Supabase 실시간 주문 데이터입니다.</p></div>
      <div class="admin-header-actions">
        <a class="secondary-button link-button" href="../index.html" target="_blank" rel="noopener noreferrer">고객 화면 열기</a>
        <button class="secondary-button" id="admin-logout" type="button">로그아웃</button>
      </div>
    </header>

    <main class="admin-main">
      <section class="metric-grid" aria-label="주문 현황 요약">
        <article class="metric-card"><span>입금 확인</span><strong id="metric-payment">0</strong></article>
        <article class="metric-card"><span>조리 대기·중</span><strong id="metric-cooking">0</strong></article>
        <article class="metric-card"><span>수령 대기</span><strong id="metric-ready">0</strong></article>
        <article class="metric-card"><span>완료</span><strong id="metric-done">0</strong></article>
      </section>

      <div class="admin-layout">
        <section class="admin-panel orders-panel">
          <div class="panel-heading"><div><h2>주문 목록</h2><p>오래된 주문부터 처리합니다.</p></div><span class="live-badge">● 실시간</span></div>
          <div class="filter-row" id="order-filters">
            <button class="active" type="button" data-filter="active">처리 중</button>
            <button type="button" data-filter="payment_pending">입금 확인</button>
            <button type="button" data-filter="confirmed">접수</button>
            <button type="button" data-filter="cooking">조리 중</button>
            <button type="button" data-filter="ready">수령 가능</button>
            <button type="button" data-filter="done">완료·취소</button>
          </div>
          <div class="admin-orders" id="admin-orders"></div>
        </section>

        <aside class="admin-panel menu-panel">
          <div class="panel-heading"><div><h2>메뉴 관리</h2><p>가격을 저장하고 판매를 시작하세요.</p></div></div>
          <div class="admin-menu-list" id="admin-menu-list"></div>
          <div class="privacy-note"><strong>공개 범위</strong><br>손님 화면에는 주문번호와 상태만 표시됩니다. 메뉴와 입금자명은 관리자 화면에서만 확인합니다.</div>
        </aside>
      </div>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
  <script src="../assets/supabase-config.js"></script>
  <script src="../assets/supabase-store.js"></script>
  <script src="../assets/admin-supabase.js"></script>
</body>
</html>
